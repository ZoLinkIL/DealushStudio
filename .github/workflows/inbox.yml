# Content inbox: Claude (or you) commits a JSON file to inbox/ and it lands in the
# studio board as a "ready" item, then the file is removed from the repo.
# The site itself is NOT rebuilt for inbox commits (see vercel.json ignoreCommand).
name: Inbox to board

on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send inbox items to the studio
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          STUDIO_API_KEY: ${{ secrets.STUDIO_API_KEY }}
        run: node scripts/push-inbox.mjs
      - name: Remove processed files
        run: |
          if git status --porcelain inbox | grep -q .; then
            git config user.name "studio-inbox"
            git config user.email "studio-inbox@users.noreply.github.com"
            git add -A inbox
            git commit -m "inbox: delivered to board [skip ci]"
            git push
          fi
